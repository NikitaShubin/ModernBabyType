; Export presets for ModernBabyType (Godot 4.3+).
; Файл в репозитории — источник правды для CI (Godot дописывает свои
; ключи при сохранении из редактора, лишние не мешают).
;
; Тонкости, на которые здесь наступали:
;   * Windows: application/modify_resources=true работает только с
;     rcedit; в образе сборки он лежит в /opt/rcedit.exe и запускается
;     через wine (см. tools/docker/Dockerfile). Пути прописываются в
;     editor_settings на старте контейнера.
;     Строки описания — ТОЛЬКО ASCII: rcedit под wine на не-ASCII
;     (например на «—») молча ничего не пишет и не ругается. Проверено
;     на 04.10.2026: с кириллицей .exe оставался с описанием шаблона.
;   * macOS: .zip вместо .dmg — .dmg собирается только на macOS
;     (нужен hdiutil), из Linux получается только zip. Подпись и
;     notarization из CI невозможны, поэтому у игрока будет
;     предупреждение Gatekeeper (см. README, раздел про macOS).
;   * Android: APK, а не AAB (AAB — для Google Play, а он не в задаче),
;     только arm64-v8a (обычных телефонов хватает), подпись —
;     debug-keystore из образа. Для публикации в Play своя подпись
;     обязательна, см. README.
;
; exclude_filter одинаковый везде: тесты гоняются только из исходников,
; а иконки чужих платформ в пакете не нужны. Исключение безобидное:
; движок читает иконку и тексты с диска на этапе экспорта и кладёт
; готовые файлы внутрь пакета (Resources/icon.icns у macOS,
; res/mipmap-* у Android, ресурсы .exe у Windows) — проверено на всех
; четырёх сборках.
;
; embed_pck=true у Windows и Linux: игроку достаётся один файл вместо
; пары «исполняемый файл + .pck». Иначе оба экспорта писали в dist
; ModernBabyType.pck с одним и тем же именем, и второй затирал первый.

